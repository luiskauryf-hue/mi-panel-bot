# Render Blueprint para SEBASTIÁN MEGA v11 (backend único)
# Uso: en Render, New > Blueprint, conecta el repo luiskauryf-hue/mi-panel-bot
# con este archivo en la raíz. Revisa que el servicio web use 1 worker.
services:
  - type: web
    name: mi-panel-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
      - key: OUTBOUND_ENABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: sebastian-mega-db
          property: connectionString
databases:
  - name: sebastian-mega-db
    plan: basic-256mb
